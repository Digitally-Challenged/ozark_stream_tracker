[project]
name = "spring-river"
version = "0.1.0"
description = "Spring River at Hardy, AR hydrologic regime study (1981-2026)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
    "scipy>=1.13,<2",
    "dataretrieval>=1.0,<2",
    "requests>=2.32,<3",
    "pyarrow>=16,<21",
    "matplotlib>=3.9,<4",
    "tabulate>=0.10.0",
    "statsmodels>=0.14,<0.15",
]

[dependency-groups]
dev = ["pytest>=8,<9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spring_river"]

[tool.pytest.ini_options]
testpaths = ["tests"]
